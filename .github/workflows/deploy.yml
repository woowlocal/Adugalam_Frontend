name: Deploy Frontend to Vercel

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual deployment triggered by user'

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://adugalam-backend-usd0.onrender.com' }}
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set in GitHub Secrets!"
            exit 1
          fi

          echo "Cleaning up local state..."
          rm -rf .vercel

          echo "Deploying production build to Vercel..."
          npx vercel --token=$VERCEL_TOKEN --prod --yes
