name: Deploy Frontend to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://adugalam-backend-usd0.onrender.com' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set in GitHub Secrets! Please add VERCEL_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Linking Vercel Project..."
            rm -rf .vercel
            mkdir -p .vercel
            echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json

            echo "Pulling Vercel Environment Information..."
            npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            echo "Building Vercel Production Artifacts..."
            npx vercel build --prod --token=$VERCEL_TOKEN
            echo "Deploying Artifacts to Vercel..."
            npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            echo "Deploying directly with Vercel CLI..."
            npx vercel --token=$VERCEL_TOKEN --prod --yes
          fi
